name: Glaon (dev)
version: '0.0.0-dev'
slug: glaon_dev
description: Glaon dev add-on — wires the setup wizard to a real HA Supervisor for Wi-Fi handoff testing on a dev HA OS box. NOT for production.
url: https://github.com/Glaon-Smart/glaon
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:home-flood
panel_title: Glaon (dev)
# `hassio_api: true` is the whole point of this dev variant — it injects
# `$SUPERVISOR_TOKEN` and lets the container reach `http://supervisor/network/*`.
# The production add-on (`addon/`) keeps this `false` per ADR 0026; this
# manifest is dev-only and never ships to the HA Add-on store.
#
# `hassio_role: admin` is REQUIRED for the network scan + update endpoints
# (#622). The Supervisor SecurityMiddleware gates `/network/.+` behind
# ROLE_MANAGER (admin matches every path); the implicit default role only
# grants `GET /network/info`, so `/network/interface/{iface}/accesspoints`
# and `/network/interface/{iface}/update` returned 403. An earlier commit
# (#611/#612) dropped `hassio_role` on the wrong assumption that the
# default role covered all of `/network/*` — it doesn't. This add-on's
# entire purpose is driving the Wi-Fi handoff, so full network access via
# admin is the intended grant; it's dev-only, local, behind Ingress + a
# trusted-LAN port. The production add-on never sets hassio_api/role.
#
# NOTE (#624): `hassio_role: admin` is INERT until HA's per-install
# Protection mode is turned OFF — while Protection mode is on the
# Supervisor caps the add-on at the base role and the scan/update
# endpoints 403. Protection mode can't be set from this manifest (HA
# security design); disable it after install with
# `addon-dev/scripts/dev-grant-network.sh` (or the UI/CLI fallbacks in
# docs/dev-addon-pi.md).
hassio_api: true
hassio_role: admin
homeassistant_api: false
auth_api: false
host_network: false
# AppArmor is intentionally OFF for this dev variant (#609).
#
# The HA base image's s6-overlay v3 bootstrap chain (`/init` →
# `s6-overlay-suexec` → `/package/admin/s6-overlay-*/command/**` →
# stage-2 service spawns under `/command/**` + dozens of utilities)
# is too broad to confine usefully — every additional path we
# whitelist exposes the next denial. Production add-on (`addon/`)
# keeps `apparmor: true` because it doesn't use `hassio_api: true`
# and its bootstrap surface is smaller; that's where the hardening
# matters.
#
# This add-on is dev-only, local-only, runs on the developer's own
# Pi behind HA Ingress, and never ships to end users. Docker's
# default seccomp + container isolation + the deny-by-default
# Supervisor network ACLs are the remaining barriers. If the s6
# story ever simplifies (e.g. HA base drops s6-overlay v3 for a
# leaner init), revisit and re-enable with a tight profile.
apparmor: false
# LAN-exposed port for apps/api integration (#615).
#
# Ingress is enough for the browser wizard, but apps/api running on a
# dev box (laptop) can't mint Ingress tokens — those are ephemeral and
# session-bound to a browser cookie. To let apps/api point its
# HA_SUPERVISOR_URL at a real Supervisor, the add-on additionally
# exposes nginx on a LAN port. Same nginx config handles both paths:
# Ingress requests come through HA Core's wrapper, LAN requests hit
# the container directly. Either way the `/api/hassio/network/`
# location block overrides the incoming Authorization header with
# the injected $SUPERVISOR_TOKEN, so apps/api can send a placeholder
# token without weakening Supervisor's auth.
#
# Security trade-off: anything on the LAN can hit
# http://homeassistant.local:8099/api/hassio/network/* and commit
# Wi-Fi changes via Supervisor. This is dev-only, trusted-LAN
# posture — production add-on (`addon/`) does NOT expose any LAN
# port. If a real concern surfaces, a follow-up issue adds a
# shared-secret header check in nginx.
#
# `null` host port lets HA pick (and is also a valid disclosure
# pattern). We set "8099" for predictability; user can edit in HA
# UI if the host port conflicts.
ports:
  '8099/tcp': 8099
ports_description:
  '8099/tcp': nginx (apps/api dev integration — LAN-trusted, see docs/dev-supervisor.md)
options: {}
schema: {}
